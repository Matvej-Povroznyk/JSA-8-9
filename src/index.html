<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JSA 8-9: JSON data format and localStorage in browser</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container" id="bookmarkApp">
      <h1>Закладки</h1>
      <input type="text" id="bookmarkInput" placeholder="URL" />
      <button id="addBookmarkBtn">Додати</button>
      <ul id="bookmarkList"></ul>
    </div>
    <div class="container" id="formApp">
      <h1>Форма</h1>
      <input type="text" id="username" placeholder="Логін" />
      <input type="password" id="password" placeholder="Пароль" />
      <button id="saveBtn">Зберегти</button>
    </div>
    <div class="container" id="contactsApp">
      <h1>Контакти</h1>
      <input type="text" id="firstName" placeholder="Ім'я" required/>
      <input type="text" id="lastName" placeholder="Призвіще" />
      <input type="tel" id="phone" placeholder="Номер телефону" required/>
      <input type="email" id="email" placeholder="Електронна адреса" />
      <button id="addContactBtn">Додати</button>
      <ul id="contactsList"></ul>
    </div>
    <script src="./js/index.js" type="module"></script>
  </body>
</html>
